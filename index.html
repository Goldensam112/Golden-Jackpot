<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Jackpots - The Cricket Desk</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #08090c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .main-card {
            max-width: 440px;
            width: 100%;
            background: radial-gradient(circle at top, #1c1f2b 0%, #0d0e14 100%);
            border-radius: 24px;
            padding: 28px 20px;
            border: 1.5px solid #282c3c;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 35px rgba(245, 158, 11, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top Live Alert */
        .live-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: #f87171;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .red-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Bold Teko Typography for Instant Impact */
        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 38px;
            line-height: 1.05;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: #f3f4f6;
        }

        h1 .gold-text {
            color: #fbbf24;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.hook {
            font-size: 14.5px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 22px;
            font-weight: 500;
        }

        p.hook span {
            color: #f1f5f9;
            font-weight: 700;
        }

        /* Value Stack Box */
        .points-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #1f2433;
            border-radius: 16px;
            padding: 16px 14px;
            margin-bottom: 22px;
            text-align: left;
        }

        .point {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .point:last-child {
            margin-bottom: 0;
        }

        .icon {
            font-size: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Unmissable High-CTR CTA */
        .cta-wrapper {
            position: relative;
            margin-top: 10px;
            margin-bottom: 16px;
        }

        .cta-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
